<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선생님을 위한 바이브 코딩 가이드</title>
    
    <!-- 노션 및 SNS 미리보기를 위한 Open Graph 태그 -->
    <meta property="og:title" content="선생님을 위한 바이브 코딩 가이드">
    <meta property="og:description" content="코딩을 몰라도 괜찮아요! AI와 함께하는 바이브 코딩의 모든 것을 쉽게 알려드립니다.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1531482615713-2afd69097998?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
    <meta property="og:url" content="https://vibecoding-edu.com">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .gradient-text {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 아이콘 컴포넌트 래퍼
        const Icon = ({ name, size = 24, color = "currentColor", className="" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} stroke={color} className={className}></i>;
        };

        const Header = () => (
            <header className="bg-white shadow-sm sticky top-0 z-50">
                <div className="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <div className="bg-blue-600 p-2 rounded-lg">
                            <Icon name="sparkles" size={20} color="white" />
                        </div>
                        <h1 className="text-xl font-bold text-slate-800">Vibe Coding <span className="text-blue-600 font-normal">for Teachers</span></h1>
                    </div>
                    <nav className="hidden md:flex gap-6 text-sm font-medium text-slate-500">
                        <a href="#intro" className="hover:text-blue-600 transition-colors">바이브 코딩이란?</a>
                        <a href="#concepts" className="hover:text-blue-600 transition-colors">핵심 개념</a>
                        <a href="#tips" className="hover:text-blue-600 transition-colors">꿀팁 전수</a>
                    </nav>
                </div>
            </header>
        );

        const Hero = () => (
            <section className="bg-white pt-16 pb-20 px-4 text-center">
                <div className="max-w-4xl mx-auto">
                    <span className="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-700 text-sm font-semibold mb-6">
                        선생님을 위한 디지털 역량 강화
                    </span>
                    <h2 className="text-4xl md:text-5xl font-bold mb-6 leading-tight">
                        코딩 문법을 몰라도<br />
                        <span className="gradient-text">상상하는 대로 수업 도구</span>를 만듭니다
                    </h2>
                    <p className="text-lg text-slate-600 mb-10 max-w-2xl mx-auto">
                        '바이브 코딩(Vibe Coding)'은 복잡한 프로그래밍 언어를 외우는 것이 아닙니다.<br/>
                        AI에게 우리가 원하는 것을 '자연어'로 설명하고, 함께 만들어가는 새로운 창작 방식입니다.
                    </p>
                    <div className="flex justify-center gap-4">
                        <a href="#concepts" className="px-8 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
                            개념 알아보기
                        </a>
                    </div>
                </div>
            </section>
        );

        const ConceptCard = ({ title, icon, color, description, analogy, imagePlaceholder }) => (
            <div className="bg-white p-6 rounded-2xl shadow-md card-hover border border-slate-100 flex flex-col h-full">
                <div className={`w-12 h-12 ${color} rounded-xl flex items-center justify-center mb-4`}>
                    <Icon name={icon} size={24} color="white" />
                </div>
                <h3 className="text-xl font-bold mb-2">{title}</h3>
                
                {/* 시각적 이해를 돕는 영역 */}
                <div className="mb-4 bg-slate-50 rounded-lg p-4 border border-slate-100 h-32 flex items-center justify-center overflow-hidden relative">
                    {imagePlaceholder}
                </div>

                <p className="text-slate-600 mb-4 text-sm flex-grow">{description}</p>
                
                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 mt-auto">
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">쉬운 비유</span>
                    <p className="text-sm font-medium text-slate-700">{analogy}</p>
                </div>
            </div>
        );

        const Concepts = () => (
            <section id="concepts" className="py-20 px-4 bg-slate-50">
                <div className="max-w-5xl mx-auto">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl font-bold mb-4">코딩, 식당에 비유하면 쉬워요!</h2>
                        <p className="text-slate-500">어려운 용어 대신 우리에게 익숙한 풍경으로 이해해 볼까요?</p>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
                        <ConceptCard 
                            title="프론트엔드 (Frontend)" 
                            icon="layout" 
                            color="bg-indigo-500"
                            description="사용자(학생, 선생님)가 눈으로 보고 클릭하는 화면 그 자체입니다. 디자인, 버튼, 글씨 등이 여기에 해당해요."
                            analogy="🍽️ 식당의 '홀(Hall)': 손님이 메뉴판을 보고 주문하고, 음식을 먹는 분위기 좋은 공간입니다."
                            imagePlaceholder={
                                <div className="w-full h-full flex flex-col gap-2 p-2">
                                    <div className="w-full h-4 bg-indigo-200 rounded animate-pulse"></div>
                                    <div className="flex gap-2">
                                        <div className="w-1/3 h-16 bg-indigo-100 rounded"></div>
                                        <div className="w-2/3 h-16 bg-indigo-50 rounded border-2 border-indigo-100 border-dashed"></div>
                                    </div>
                                    <div className="w-1/2 h-4 bg-indigo-200 rounded mt-1"></div>
                                </div>
                            }
                        />
                        <ConceptCard 
                            title="백엔드 (Backend)" 
                            icon="database" 
                            color="bg-emerald-500"
                            description="눈에 보이지 않지만, 데이터를 저장하고 계산하고 처리하는 뒷단의 기술입니다."
                            analogy="👨‍🍳 식당의 '주방(Kitchen)': 손님 눈엔 안 보이지만, 재료를 다듬고 요리(데이터 처리)를 하는 곳입니다."
                            imagePlaceholder={
                                <div className="flex items-center justify-center gap-2">
                                    <div className="w-8 h-12 bg-emerald-600 rounded-md shadow-lg flex flex-col justify-around p-1">
                                        <div className="h-1 w-full bg-emerald-300 rounded-full"></div>
                                        <div className="h-1 w-full bg-emerald-300 rounded-full"></div>
                                    </div>
                                    <div className="h-1 w-8 bg-slate-300"></div>
                                    <div className="w-8 h-12 bg-emerald-600 rounded-md shadow-lg flex flex-col justify-around p-1">
                                        <div className="h-1 w-full bg-emerald-300 rounded-full"></div>
                                        <div className="h-1 w-full bg-emerald-300 rounded-full"></div>
                                    </div>
                                </div>
                            }
                        />
                        <ConceptCard 
                            title="API 키 (API Key)" 
                            icon="key" 
                            color="bg-amber-500"
                            description="외부 서비스(예: ChatGPT, 날씨 정보)를 내 프로그램에서 가져다 쓰기 위한 '디지털 출입증'입니다."
                            analogy="🎫 식당의 'VIP 멤버십 카드': 아무나 못 들어가는 창고에서 고급 재료를 꺼내올 수 있는 권한입니다."
                            imagePlaceholder={
                                <div className="relative flex items-center justify-center">
                                    <div className="absolute w-20 h-12 bg-amber-100 rounded-lg transform -rotate-6 border border-amber-200"></div>
                                    <div className="relative w-20 h-12 bg-white rounded-lg shadow-md border border-amber-300 flex items-center justify-center gap-1 transform rotate-6">
                                        <div className="w-2 h-2 rounded-full bg-slate-200"></div>
                                        <div className="w-8 h-2 rounded bg-slate-200"></div>
                                    </div>
                                    <Icon name="lock" size={16} className="absolute -top-1 -right-1 text-amber-600 bg-white rounded-full p-0.5" />
                                </div>
                            }
                        />
                    </div>
                </div>
            </section>
        );

        const TipItem = ({ number, title, content }) => (
            <div className="flex gap-4 items-start mb-8">
                <div className="flex-shrink-0 w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg">
                    {number}
                </div>
                <div>
                    <h4 className="text-lg font-bold text-slate-800 mb-2">{title}</h4>
                    <p className="text-slate-600 leading-relaxed">{content}</p>
                </div>
            </div>
        );

        const Tips = () => (
            <section id="tips" className="py-20 px-4 bg-white">
                <div className="max-w-4xl mx-auto">
                    <div className="flex flex-col md:flex-row gap-12 items-center">
                        <div className="md:w-1/2">
                            <h2 className="text-3xl font-bold mb-6">바이브 코딩을<br/>잘하는 선생님의 비밀</h2>
                            <p className="text-slate-500 mb-8">
                                AI는 똑똑하지만 독심술사는 아닙니다.<br/>
                                원하는 결과를 얻기 위한 3가지 팁을 소개합니다.
                            </p>
                            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                <div className="flex items-center gap-3 mb-4">
                                    <Icon name="message-circle" size={24} className="text-blue-500" />
                                    <span className="font-bold">좋은 질문(프롬프트) 예시</span>
                                </div>
                                <div className="text-sm space-y-3">
                                    <p className="text-red-400 line-through">"퀴즈 앱 만들어줘."</p>
                                    <p className="text-blue-600 font-medium">
                                        "초등학교 3학년 사회 시간 '우리 고장' 단원에서 사용할 OX 퀴즈 웹사이트를 만들어줘. 
                                        배경은 밝은 노란색이고, 정답을 맞히면 폭죽 효과가 나왔으면 좋겠어."
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div className="md:w-1/2">
                            <TipItem 
                                number="1" 
                                title="상황과 대상을 구체적으로!" 
                                content="누가 사용할 것인지(초등학생? 교사?), 어떤 상황에서 쓸 것인지 구체적으로 묘사할수록 AI는 딱 맞는 코드를 짜줍니다." 
                            />
                            <TipItem 
                                number="2" 
                                title="단계별로 요청하세요" 
                                content="한 번에 거대한 시스템을 만들려고 하지 마세요. '먼저 화면만 만들어줘', 그 다음 '버튼 기능을 넣어줘' 처럼 하나씩 완성해 나가는 것이 좋습니다." 
                            />
                            <TipItem 
                                number="3" 
                                title="에러는 AI에게 다시 물어보세요" 
                                content="오류가 났다고 겁먹지 마세요. 오류 메시지를 복사해서 AI에게 '이런 오류가 났어, 고쳐줘'라고 하면 친절하게 해결책을 줍니다." 
                            />
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="bg-slate-900 text-slate-400 py-12 px-4 text-center">
                <div className="max-w-4xl mx-auto">
                    <Icon name="heart" size={32} className="text-red-500 mx-auto mb-4" />
                    <h3 className="text-white text-xl font-bold mb-4">선생님의 아이디어가 현실이 됩니다</h3>
                    <p className="mb-8">바이브 코딩과 함께 교실을 변화시키는 즐거운 여정을 시작해보세요.</p>
                    <div className="text-sm">
                        &copy; 2024 Vibe Coding Training for Teachers. All rights reserved.
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="min-h-screen">
                    <Header />
                    <main>
                        <Hero />
                        <Concepts />
                        <Tips />
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
